# OCA (Odoo Community Association) ruff configuration for Odoo 17.
# PEP 8 + pyflakes + bugbear + isort (OCA section order) + pyupgrade + mccabe.
target-version = "py310"
extend-exclude = ["_disabled", "playwright-tests"]

[lint]
extend-select = [
    "B",    # flake8-bugbear: likely bugs
    "C90",  # mccabe: cyclomatic complexity
    "E501", # line too long (88)
    "I",    # isort
    "UP",   # pyupgrade
]
# RUF012: Odoo reads _inherit / _order / _sql_constraints as class settings, they are not
# shared mutable defaults; the rule does not apply to Odoo models.
ignore = ["RUF012"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # Odoo package imports: unused by design, order matters
"__manifest__.py" = ["B018"]  # a manifest is a bare dict expression

[lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "odoo",
    "odoo-addons",
    "first-party",
    "local-folder",
]

[lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]

[lint.mccabe]
max-complexity = 16
